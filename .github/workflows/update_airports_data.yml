name: Update Airports Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CSV files safely
        run: |
          download_file () {
            URL=$1
            OUTPUT=$2
            TEMP_FILE="${OUTPUT}.tmp"

            echo "Downloading $OUTPUT"

            if curl -L --fail -o "$TEMP_FILE" "$URL"; then
              mv "$TEMP_FILE" "$OUTPUT"
              echo "Updated $OUTPUT"
            else
              rm -f "$TEMP_FILE"
              echo "Failed to download $OUTPUT. Keeping existing file."
            fi
          }

          download_file https://davidmegginson.github.io/ourairports-data/airports.csv data/airports.csv
          download_file https://davidmegginson.github.io/ourairports-data/runways.csv data/runways.csv
          download_file https://davidmegginson.github.io/ourairports-data/airport-frequencies.csv data/airport-frequencies.csv
          download_file https://davidmegginson.github.io/ourairports-data/countries.csv data/countries.csv
          download_file https://davidmegginson.github.io/ourairports-data/regions.csv data/regions.csv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Build SQLite database
        run: |
          python -m scripts.build_database.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/*.csv

          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
          else
            git commit -m "Update airport data pipeline"
            git push
          fi